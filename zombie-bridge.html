<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<!--ART-START-->
<title>ゾンビブリッジ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@500;800&display=swap">
<style>
  /* Layout: one full-screen canvas, HUD pinned to the top, menus as centered panels */
  :root{
    --night:#0e1a24; --steel:#1d2c38; --panel:rgba(14,26,36,.92);
    --ink:#f2f6f8; --dim:#9fb3c2; --good:#2f8cff; --bad:#ff4a4a; --gold:#ffc83d;
    --display:"Dela Gothic One","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    --body:"M PLUS 1p","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    color-scheme:dark;
  }
  html,body{height:100%;margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--body);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  [hidden]{display:none!important}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
    display:flex;gap:10px;align-items:center;pointer-events:none;font-weight:800}
  #hud .chip{background:rgba(0,0,0,.45);border-radius:999px;padding:4px 12px;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
  #hud .bar{flex:1;height:8px;background:rgba(0,0,0,.45);border-radius:4px;overflow:hidden;min-width:40px}
  #hud .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--good),#7fd1ff)}
  #pauseBtn{pointer-events:auto;border:0;background:rgba(0,0,0,.45);color:var(--ink);width:32px;height:32px;border-radius:50%;font-size:14px;font-weight:800}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:rgba(5,10,15,.55)}
  .panel{background:var(--panel);border:1px solid #2c4252;border-radius:18px;padding:22px 20px;width:100%;max-width:360px;
    display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .logo{font-family:var(--display);font-size:42px;line-height:1.05;margin:4px 0;letter-spacing:.02em;
    color:#fff;text-shadow:0 3px 0 #1a4f9c,0 6px 0 rgba(0,0,0,.4)}
  .logo small{display:block;font-size:15px;color:var(--gold);text-shadow:none;letter-spacing:.3em;margin-top:6px}
  .panel h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0}
  .panel p{margin:0;color:var(--dim);font-size:14px;line-height:1.6}
  .btn{border:0;border-radius:12px;padding:14px;font:800 17px var(--body);color:#fff;background:var(--good);cursor:pointer;
    box-shadow:0 4px 0 #1b5bb0}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #1b5bb0}
  .btn.sub{background:#34495a;box-shadow:0 4px 0 #1f2e3a}
  .btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .coins{color:var(--gold);font-weight:800;font-variant-numeric:tabular-nums}
  .shop{display:flex;flex-direction:column;gap:8px}
  .item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-align:left;background:#16242f;border-radius:12px;padding:10px 12px}
  .item b{font-size:15px}
  .item span{grid-column:1;color:var(--dim);font-size:12px}
  .item button{grid-row:1 / span 2;grid-column:2;border:0;border-radius:10px;padding:8px 10px;min-width:84px;font:800 14px var(--body);
    background:var(--gold);color:#3a2800;cursor:pointer}
  .item button:disabled{background:#3a4a56;color:#7f909c;cursor:default}
  .help{font-size:13px;color:var(--dim);text-align:left;line-height:1.7;margin:0;padding-left:1.2em}
  .stats{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;font-size:15px;font-variant-numeric:tabular-nums}
  .stats dd{margin:0;text-align:right;font-weight:800}
  .stats dt{color:var(--dim)}
  @media (prefers-reduced-motion:reduce){.btn:active{transform:none}}
</style>

<canvas id="game"></canvas>
<div id="hud" hidden>
  <span class="chip" id="hStage">STAGE 1</span>
  <span class="bar"><i id="hProg"></i></span>
  <span class="chip coins" id="hCoins">● 0</span>
  <button id="pauseBtn" aria-label="一時停止">II</button>
</div>

<div class="overlay" id="title">
  <div class="panel">
    <div class="logo">ゾンビ<br>ブリッジ<small>BRIDGE OF THE DEAD</small></div>
    <p>橋の向こうからゾンビの大群。<br>仲間を増やして撃ちまくれ！</p>
    <ul class="help">
      <li>画面を左右にドラッグして移動（射撃は自動）</li>
      <li><b style="color:#7fb8ff">青いゲート</b>で仲間が増える。<b style="color:#ff8a8a">赤</b>は減る</li>
      <li>ゲートは撃つと数字が増える。赤も撃てば青に変わる</li>
      <li>数字つきの箱を壊すと武器がパワーアップ</li>
      <li>最後に巨大ゾンビ。倒せばステージクリア</li>
    </ul>
    <button class="btn" id="startBtn">スタート</button>
    <button class="btn sub" id="shopBtn">強化（<span class="coins" id="tCoins">0</span>）</button>
    <p id="tBest"></p>
  </div>
</div>

<div class="overlay" id="shopPanel" hidden>
  <div class="panel">
    <h2>強化</h2>
    <p>ゲーム内コインで強化できます（課金なし）</p>
    <div class="coins" id="sCoins" style="font-size:20px">● 0</div>
    <div class="shop" id="shopList"></div>
    <button class="btn" id="shopClose">もどる</button>
  </div>
</div>

<div class="overlay" id="result" hidden>
  <div class="panel">
    <h2 id="rTitle">クリア！</h2>
    <dl class="stats" id="rStats"></dl>
    <button class="btn" id="rNext">次のステージ</button>
    <button class="btn sub" id="rShop">強化</button>
    <button class="btn sub" id="rTitleBtn">タイトルへ</button>
  </div>
</div>

<div class="overlay" id="pausePanel" hidden>
  <div class="panel">
    <h2>一時停止</h2>
    <button class="btn" id="resumeBtn">つづける</button>
    <button class="btn sub" id="quitBtn">あきらめる</button>
  </div>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

// ---------- 保存データ ----------
const SAVE_KEY = 'zombieBridgeSave.v1';
let save = { stage: 1, coins: 0, best: 0, up: { dmg: 0, rate: 0, men: 0, gun: 0 } };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.up) save = Object.assign(save, s, { up: Object.assign(save.up, s.up) }); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

const UPGRADES = [
  { key: 'dmg',  name: '攻撃力',     desc: lv => `ダメージ +${lv * 15}%`,       cost: lv => Math.round(30 * Math.pow(1.45, lv)), max: 40 },
  { key: 'rate', name: '連射速度',   desc: lv => `連射 +${lv * 6}%`,            cost: lv => Math.round(40 * Math.pow(1.5, lv)),  max: 15 },
  { key: 'men',  name: 'スタート人数', desc: lv => `最初から ${1 + lv} 人`,       cost: lv => Math.round(25 * Math.pow(1.4, lv)),  max: 30 },
  { key: 'gun',  name: '初期武器',   desc: lv => `最初から「${WEAPONS[Math.min(lv, 2)].name}」`, cost: lv => [150, 600][lv] || 0, max: 2 },
];
const WEAPONS = [
  { name: 'ハンドガン',     iv: 0.42, dmg: 1.0, shots: 1, color: '#ffe9a8' },
  { name: 'アサルトライフル', iv: 0.22, dmg: 1.0, shots: 1, color: '#ffd36b' },
  { name: 'ツインガン',     iv: 0.17, dmg: 1.0, shots: 2, color: '#9ff0ff' },
  { name: 'ミニガン',       iv: 0.08, dmg: 0.9, shots: 1, color: '#bfe3ff' },
  { name: 'プラズマ砲',     iv: 0.07, dmg: 1.5, shots: 2, color: '#d6a8ff' },
];

// ---------- 画面とカメラ ----------
let W = 0, H = 0, DPR = 1, F = 1, HORIZON = 0;
const CAM_BACK = 6, CAM_H = 4.2, ROAD = 2.2, FAR = 70;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  F = Math.min(0.95 * H, (W * 0.5 * CAM_BACK) / (ROAD + 0.35));
  HORIZON = H * 0.8 - (CAM_H * F) / CAM_BACK;
  buildSkyline();
}
let camX = 0;
function proj(x, y, z) {
  const d = z + CAM_BACK;
  if (d < 0.4) return null;
  const s = F / d;
  return { x: W / 2 + (x - camX) * s, y: HORIZON + (CAM_H - y) * s, s };
}

// ---------- 乱数 ----------
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- 背景のビル群 ----------
let skyline = [];
function buildSkyline() {
  const r = rng(7); skyline = [];
  let x = -20;
  while (x < W + 20) { const w = 14 + r() * 40, h = 20 + r() * 90; skyline.push({ x, w, h, shade: r() }); x += w + r() * 6; }
}

// ---------- ゲーム状態 ----------
let state = 'title';   // title | play | pause | result
let G = null;
const MAX_MEN = 400;

function newGame(stage) {
  const r = rng(stage * 9973 + 17);
  const L = 230 + stage * 18;
  const events = [];
  let pos = 22, k = 0;
  const hpZ = 2 + stage * 1.3;
  while (pos < L) {
    const roll = r();
    if (k === 0 || roll < 0.38) {
      // ゲート2枚
      const good = () => r() < 0.22 && k > 1 ? { op: 'x', v: 2 } : { op: '+', v: Math.round(3 + r() * 5 + stage * 1.5) };
      const bad = () => r() < 0.15 && k > 2 ? { op: '/', v: 2 } : { op: '+', v: -Math.round(4 + r() * 6 + stage * 2.5) };
      let a = good(), b = r() < 0.7 ? bad() : good();
      if (r() < 0.5) [a, b] = [b, a];
      events.push({ at: pos, type: 'gates', a, b });
      pos += 13 + r() * 6;
    } else if (roll < 0.55) {
      events.push({ at: pos, type: 'crate', x: r() < 0.5 ? -1.1 : 1.1, hp: Math.round(18 + stage * 22 + k * 7) });
      events.push({ at: pos + 6, type: 'horde', n: Math.round(6 + stage * 3 + r() * 6), hp: hpZ, depth: 6 });
      pos += 18 + r() * 6;
    } else {
      events.push({ at: pos, type: 'horde', n: Math.round(10 + stage * 4.5 + r() * 12 + k * 0.8), hp: hpZ, depth: 8 + r() * 6, big: r() < 0.35 + stage * 0.04 });
      pos += 16 + r() * 8;
    }
    k++;
  }
  G = {
    stage, L, events, ev: 0, dist: 0, speed: 5.2,
    men: 1 + save.up.men, menShown: 1 + save.up.men, weapon: Math.min(save.up.gun, 2),
    x: 0, tx: 0, fireT: 0,
    zombies: [], bullets: [], gates: [], crates: [], parts: [], texts: [],
    boss: null, bossSpawned: false, kills: 0, coinsRun: 0, t: 0, shake: 0, over: false, endT: 0,
  };
}

function dmgMult() { return 1 + save.up.dmg * 0.15; }
function rateMult() { return 1 + save.up.rate * 0.06; }
function squadR(n) { return Math.min(1.45, 0.22 + 0.085 * Math.sqrt(n)); }

function spawnEvent(e) {
  const z0 = e.at - G.dist;
  if (e.type === 'gates') {
    const pair = { passed: false };
    for (const [side, d] of [[-1, e.a], [1, e.b]]) G.gates.push({ z: z0, side, g: { ...d, cap: Math.abs(d.v) + 15 }, pair, flash: 0 });
  } else if (e.type === 'crate') {
    G.crates.push({ z: z0, x: e.x, hp: e.hp, max: e.hp, flash: 0 });
  } else if (e.type === 'horde') {
    for (let i = 0; i < e.n; i++) addZombie((Math.random() * 2 - 1) * (ROAD - 0.35), z0 + Math.random() * e.depth, e.hp, 1, 1);
    if (e.big) addZombie((Math.random() * 2 - 1) * 1.2, z0 + e.depth + 1, e.hp * 9, 6, 1.7);
  }
}
function addZombie(x, z, hp, power, size) {
  G.zombies.push({ x, z, hp, max: hp, power, size, sp: 1.1 + Math.random() * 1.1, ph: Math.random() * 6.28, flash: 0,
    shirt: ['#5d6b4c', '#6b5446', '#4a5a6e', '#7a6a52', '#5a4a5e', '#3e5a52'][(Math.random() * 6) | 0] });
}

// ---------- 入力 ----------
let drag = null;
const keys = {};
cv.addEventListener('pointerdown', e => { if (state !== 'play') return; drag = { sx: e.clientX, x0: G.tx }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!drag || state !== 'play') return;
  const ppu = F / CAM_BACK * 0.85;
  G.tx = clampX(drag.x0 + (e.clientX - drag.sx) / ppu);
});
const endDrag = () => { drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
addEventListener('keydown', e => { keys[e.key] = true; if (e.key === 'Escape' && state === 'play') pause(); });
addEventListener('keyup', e => { keys[e.key] = false; });
function clampX(x) { return Math.max(-ROAD + 0.35, Math.min(ROAD - 0.35, x)); }

// ---------- 更新 ----------
function addText(x, z, y, s, color, size = 1) { G.texts.push({ x, z, y, s, color, size, t: 0 }); }
function splat(x, z, y, color, n) {
  for (let i = 0; i < n && G.parts.length < 350; i++)
    G.parts.push({ x, z, y, vx: (Math.random() - 0.5) * 3, vz: (Math.random() - 0.3) * 3, vy: 1 + Math.random() * 3, t: 0, life: 0.35 + Math.random() * 0.3, color });
}

function update(dt) {
  G.t += dt;
  // 移動
  const kx = (keys.ArrowLeft || keys.a ? -1 : 0) + (keys.ArrowRight || keys.d ? 1 : 0);
  if (kx) G.tx = clampX(G.tx + kx * 5 * dt);
  G.x += (G.tx - G.x) * Math.min(1, dt * 14);
  camX += (G.x * 0.35 - camX) * Math.min(1, dt * 6);

  // 走行（ボス戦では停止）
  const target = G.bossSpawned ? 0 : 5.2;
  G.speed += (target - G.speed) * Math.min(1, dt * 2);
  const run = G.speed * dt;
  G.dist += run;

  while (G.ev < G.events.length && G.events[G.ev].at - G.dist < FAR - 5) spawnEvent(G.events[G.ev++]);
  if (!G.bossSpawned && G.ev >= G.events.length && G.dist > G.L + 8) {
    G.bossSpawned = true;
    const hp = Math.round(500 * Math.pow(G.stage, 1.35));
    G.boss = { x: 0, z: 34, hp, max: hp, sp: 0.9 + G.stage * 0.04, flash: 0, ph: 0, hitT: 0 };
    for (let i = 0; i < 10 + G.stage * 3; i++) addZombie((Math.random() * 2 - 1) * (ROAD - 0.35), 36 + Math.random() * 10, 2 + G.stage * 1.3, 1, 1);
  }

  const R = squadR(G.men);

  // 射撃
  const w = WEAPONS[G.weapon];
  G.fireT -= dt;
  if (G.fireT <= 0 && G.men > 0) {
    G.fireT += w.iv / rateMult();
    if (G.fireT < 0) G.fireT = 0;
    const shooters = Math.min(G.men, 10);
    const per = (G.men * w.dmg * dmgMult()) / (shooters * w.shots);
    for (let i = 0; i < shooters; i++) {
      const p = formation(i, Math.min(G.men, 10), R);
      for (let s = 0; s < w.shots; s++) {
        const off = w.shots > 1 ? (s - 0.5) * 0.18 : 0;
        G.bullets.push({ x: G.x + p.x + off, z: p.z + 0.4, dmg: per, life: 1.6 });
      }
    }
  }

  // 弾
  for (const b of G.bullets) {
    const oz = b.z;
    b.z += 34 * dt - run; b.life -= dt;
    // ゲート
    for (const g of G.gates) {
      if (g.pair.passed) continue;
      if (oz <= g.z && b.z >= g.z - 0.05 && (g.side < 0 ? b.x < 0 : b.x >= 0)) {
        b.life = 0; g.flash = 0.08;
        if (g.g.op === '+') g.g.v = Math.min(g.g.cap, g.g.v + 0.2);
        break;
      }
    }
    if (b.life <= 0) continue;
    // 箱
    for (const c of G.crates) {
      if (c.hp > 0 && Math.abs(b.x - c.x) < 0.6 && b.z >= c.z - 0.4 && oz <= c.z + 0.4) {
        b.life = 0; c.hp -= b.dmg; c.flash = 0.06;
        if (c.hp <= 0) breakCrate(c);
        break;
      }
    }
    if (b.life <= 0) continue;
    // ボス
    const B = G.boss;
    if (B && B.hp > 0 && Math.abs(b.x - B.x) < 1.0 && b.z >= B.z - 0.5 && oz <= B.z + 0.5) {
      b.life = 0; B.hp -= b.dmg; B.flash = 0.05;
      if (Math.random() < 0.3) splat(b.x, B.z - 0.4, 1.5 + Math.random(), '#8a3fbf', 1);
      if (B.hp <= 0) killBoss();
      continue;
    }
    // ゾンビ
    for (const zb of G.zombies) {
      if (zb.hp <= 0) continue;
      if (Math.abs(b.x - zb.x) < 0.24 * zb.size && b.z >= zb.z - 0.3 && oz <= zb.z + 0.3) {
        b.life = 0; zb.hp -= b.dmg; zb.flash = 0.06;
        if (zb.hp <= 0) killZombie(zb);
        break;
      }
    }
  }
  G.bullets = G.bullets.filter(b => b.life > 0 && b.z < FAR);

  // ゲート通過
  for (const g of G.gates) {
    g.z -= run; g.flash -= dt;
    if (!g.pair.passed && g.z <= 0.2) {
      if ((g.side < 0) === (G.x < 0)) {
        g.pair.passed = true; g.hit = true;
        const before = G.men;
        if (g.g.op === '+') G.men += Math.floor(g.g.v);
        else if (g.g.op === 'x') G.men *= g.g.v;
        else G.men = Math.floor(G.men / g.g.v);
        G.men = Math.max(0, Math.min(MAX_MEN, Math.round(G.men)));
        const d = G.men - before;
        addText(G.x, 0.5, 2.2, (d >= 0 ? '+' : '') + d, d >= 0 ? '#7fd1ff' : '#ff6b6b', 1.4);
        if (d < 0) G.shake = 0.25;
      }
    }
  }
  G.gates = G.gates.filter(g => g.z > -3);

  // 箱
  for (const c of G.crates) { c.z -= run; c.flash -= dt; }
  G.crates = G.crates.filter(c => c.z > -3 && c.hp > 0);

  // ゾンビ
  for (const zb of G.zombies) {
    if (zb.hp <= 0) continue;
    zb.z -= run + zb.sp * dt;
    zb.ph += dt * (4 + zb.sp * 2);
    zb.flash -= dt;
    if (zb.z < 22) zb.x += Math.sign(G.x - zb.x) * Math.min(Math.abs(G.x - zb.x), 0.7 * dt);
    if (zb.z < 0.45 && zb.z > -0.8 && Math.abs(zb.x - G.x) < R + 0.2 * zb.size) {
      zb.hp = 0;
      G.men = Math.max(0, G.men - zb.power);
      splat(zb.x, zb.z, 0.6, '#c43a3a', 4);
      G.shake = 0.15;
    }
  }
  G.zombies = G.zombies.filter(zb => zb.hp > 0 && zb.z > -2);

  // ボス
  const B = G.boss;
  if (B && B.hp > 0) {
    B.flash -= dt; B.ph += dt * 3;
    if (B.z > 0.9) B.z -= B.sp * dt;
    B.x += Math.sign(G.x - B.x) * Math.min(Math.abs(G.x - B.x), 0.35 * dt);
    if (B.z <= 0.9 && Math.abs(B.x - G.x) < R + 0.9) {
      B.hitT -= dt;
      if (B.hitT <= 0) {
        B.hitT = 0.3;
        const lost = Math.max(1, Math.ceil(G.men * 0.08));
        G.men = Math.max(0, G.men - lost);
        G.shake = 0.3; splat(G.x, 0.3, 0.6, '#c43a3a', 6);
      }
    }
  }

  // エフェクト
  for (const p of G.parts) { p.t += dt; p.x += p.vx * dt; p.z += p.vz * dt - run; p.y += p.vy * dt; p.vy -= 9 * dt; }
  G.parts = G.parts.filter(p => p.t < p.life);
  for (const t of G.texts) { t.t += dt; t.y += dt * 1.2; t.z -= run * 0.3; }
  G.texts = G.texts.filter(t => t.t < 1.1);
  G.shake = Math.max(0, G.shake - dt);
  G.menShown += (G.men - G.menShown) * Math.min(1, dt * 10);

  // 勝敗
  if (!G.over) {
    if (G.men <= 0) { G.over = 'lose'; G.endT = 1.0; }
    else if (G.boss && G.boss.hp <= 0) { G.over = 'win'; G.endT = 1.4; }
  } else {
    G.endT -= dt;
    if (G.endT <= 0) finish(G.over === 'win');
  }

  $('hProg').style.width = Math.min(100, (G.dist / (G.L + 8)) * 100) + '%';
  $('hCoins').textContent = '● ' + (save.coins + G.coinsRun);
}

function formation(i, m, R) {
  if (i === 0) return { x: 0, z: 0 };
  const r = R * Math.sqrt(i / Math.max(1, m - 1));
  const a = i * 2.39996;
  return { x: Math.cos(a) * r, z: Math.sin(a) * r * 0.55 - 0.15 };
}

function breakCrate(c) {
  splat(c.x, c.z, 0.6, '#c99a52', 12);
  if (G.weapon < WEAPONS.length - 1) {
    G.weapon++;
    addText(c.x, c.z, 2, WEAPONS[G.weapon].name + '！', '#ffd36b', 1.1);
  } else {
    const add = 5 + G.stage * 2;
    G.men = Math.min(MAX_MEN, G.men + add);
    addText(c.x, c.z, 2, '+' + add + '人', '#7fd1ff', 1.1);
  }
  G.coinsRun += 5;
}
function killZombie(zb) {
  G.kills++; G.coinsRun += zb.power > 1 ? 8 : 1;
  splat(zb.x, zb.z, 0.7 * zb.size, '#6fae3f', zb.power > 1 ? 14 : 5);
}
function killBoss() {
  const B = G.boss;
  G.coinsRun += 40 * G.stage;
  splat(B.x, B.z, 2, '#8a3fbf', 60);
  G.shake = 0.5;
  for (const zb of G.zombies) { zb.hp = 0; splat(zb.x, zb.z, 0.7, '#6fae3f', 3); }
}

// ---------- 描画 ----------
function draw() {
  const sh = G && G.shake > 0 ? G.shake * 14 : 0;
  ctx.save();
  if (sh) ctx.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);
  drawWorld();
  if (G && state !== 'title') drawObjects();
  ctx.restore();
}

function drawWorld() {
  // 空
  const sky = ctx.createLinearGradient(0, 0, 0, HORIZON);
  sky.addColorStop(0, '#5f86a6'); sky.addColorStop(1, '#c9d9e3');
  ctx.fillStyle = sky; ctx.fillRect(-20, -20, W + 40, HORIZON + 21);
  // ビル
  for (const b of skyline) { ctx.fillStyle = `rgba(${90 + b.shade * 40},${110 + b.shade * 35},${128 + b.shade * 30},.75)`; ctx.fillRect(b.x, HORIZON - b.h * (H / 900), b.w, b.h * (H / 900)); }
  // 海
  const sea = ctx.createLinearGradient(0, HORIZON, 0, H);
  sea.addColorStop(0, '#9fbfd0'); sea.addColorStop(0.25, '#3f7fa5'); sea.addColorStop(1, '#174f74');
  ctx.fillStyle = sea; ctx.fillRect(-20, HORIZON, W + 40, H - HORIZON + 20);
  const off = G ? G.dist : performance.now() / 300;
  // 波
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1;
  for (let i = 0; i < 26; i++) {
    const z = ((i * 3 - off * 0.6) % 78 + 78) % 78 - 4;
    const p = proj(0, -0.8, z); if (!p) continue;
    for (const sx of [-1, 1]) { const q = proj(sx * (ROAD + 2 + (i % 5) * 1.7), -0.8, z); if (q) { ctx.beginPath(); ctx.moveTo(q.x - q.s * 0.6, q.y); ctx.lineTo(q.x + q.s * 0.6, q.y); ctx.stroke(); } }
  }
  // 橋の側面
  const zN = -3.4, zF = FAR;
  const a = proj(-ROAD - 0.25, 0, zF), b2 = proj(ROAD + 0.25, 0, zF), c = proj(ROAD + 0.25, 0, zN), d = proj(-ROAD - 0.25, 0, zN);
  const a2 = proj(-ROAD - 0.25, -0.5, zF), d2 = proj(-ROAD - 0.25, -0.5, zN), b3 = proj(ROAD + 0.25, -0.5, zF), c3 = proj(ROAD + 0.25, -0.5, zN);
  ctx.fillStyle = '#5b6670';
  poly([a, d, d2, a2]); poly([b2, c, c3, b3]);
  // 路面
  const road = ctx.createLinearGradient(0, a.y, 0, H);
  road.addColorStop(0, '#9aa3a9'); road.addColorStop(1, '#7c858c');
  ctx.fillStyle = road; poly([a, b2, c, d]);
  // 白線
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  for (let k = 0; k < 20; k++) {
    const z1 = k * 4 - (off % 4) - 3, z2 = z1 + 1.8;
    if (z2 < zN || z1 > zF) continue;
    const p1 = proj(-0.05, 0, Math.max(z1, zN)), p2 = proj(0.05, 0, Math.max(z1, zN)), p3 = proj(0.05, 0, z2), p4 = proj(-0.05, 0, z2);
    if (p1 && p3) poly([p1, p2, p3, p4]);
  }
  // 欄干
  for (const sx of [-1, 1]) {
    const x = sx * (ROAD + 0.15);
    ctx.strokeStyle = '#6b4a3a'; ctx.lineWidth = 1;
    for (let k = 0; k < 36; k++) {
      const z = k * 2 - (off % 2) - 3;
      if (z < zN || z > zF) continue;
      const p = proj(x, 0, z), q = proj(x, 0.7, z);
      if (p && q) { ctx.lineWidth = Math.max(1, p.s * 0.06); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke(); }
    }
    const t1 = proj(x, 0.7, zN), t2 = proj(x, 0.7, zF);
    ctx.strokeStyle = '#8a5f48'; ctx.lineWidth = Math.max(2, t1.s * 0.08);
    ctx.beginPath(); ctx.moveTo(t1.x, t1.y); ctx.lineTo(t2.x, t2.y); ctx.stroke();
  }
  // 遠景のかすみ
  const fog = ctx.createLinearGradient(0, HORIZON - 10, 0, HORIZON + (a.y - HORIZON) + 40);
  fog.addColorStop(0, 'rgba(201,217,227,.9)'); fog.addColorStop(1, 'rgba(201,217,227,0)');
  ctx.fillStyle = fog; ctx.fillRect(-20, HORIZON - 10, W + 40, (a.y - HORIZON) + 50);
}
function poly(ps) { ctx.beginPath(); ctx.moveTo(ps[0].x, ps[0].y); for (let i = 1; i < ps.length; i++) ctx.lineTo(ps[i].x, ps[i].y); ctx.closePath(); ctx.fill(); }

function drawObjects() {
  const list = [];
  for (const zb of G.zombies) list.push({ z: zb.z, f: () => drawZombie(zb) });
  for (const g of G.gates) list.push({ z: g.z, f: () => drawGate(g) });
  for (const c of G.crates) list.push({ z: c.z, f: () => drawCrate(c) });
  if (G.boss && G.boss.hp > 0) list.push({ z: G.boss.z, f: () => drawBoss(G.boss) });
  const R = squadR(G.men);
  const m = Math.min(Math.round(G.menShown), 60);
  for (let i = 0; i < m; i++) { const p = formation(i, m, R); list.push({ z: p.z, f: () => drawSoldier(G.x + p.x, p.z, i === 0) }); }
  list.sort((a, b) => b.z - a.z);
  for (const o of list) o.f();

  // 弾
  ctx.globalCompositeOperation = 'lighter';
  const col = WEAPONS[G.weapon].color;
  for (const b of G.bullets) {
    const p = proj(b.x, 0.65, b.z), q = proj(b.x, 0.65, b.z - 0.9);
    if (!p || !q) continue;
    ctx.strokeStyle = col; ctx.lineWidth = Math.max(1.5, p.s * 0.07); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(p.x, p.y); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
  // 破片
  for (const p of G.parts) {
    const q = proj(p.x, Math.max(0, p.y), p.z); if (!q) continue;
    ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(1.2, q.s * 0.06), 0, 6.28); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 人数の表示
  if (G.men > 0) {
    const p = proj(G.x, 1.5 + R * 0.3, 0);
    if (p) bubble(p.x, p.y, String(G.men), '#1d6fe0', 22);
  }
  // 浮かぶ文字
  for (const t of G.texts) {
    const p = proj(t.x, t.y, t.z); if (!p) continue;
    ctx.globalAlpha = Math.max(0, 1 - t.t / 1.1);
    outlined(t.s, p.x, p.y, 26 * t.size, t.color);
  }
  ctx.globalAlpha = 1;
  // ボスのHP
  if (G.boss && G.boss.hp > 0) {
    const bw = Math.min(W - 40, 320), bx = (W - bw) / 2, by = 56 + (parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0);
    ctx.fillStyle = 'rgba(0,0,0,.55)'; roundRect(bx - 4, by - 4, bw + 8, 22, 8); ctx.fill();
    ctx.fillStyle = '#b54cff'; roundRect(bx, by, bw * Math.max(0, G.boss.hp / G.boss.max), 14, 6); ctx.fill();
    outlined('巨大ゾンビ', W / 2, by + 34, 15, '#fff');
  }
  // 武器名
  outlined(WEAPONS[G.weapon].name, W / 2, H - 22 - (parseFloat(getComputedStyle(document.documentElement).paddingBottom) || 0), 15, '#ffe9a8');
}

function roundRect(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, Math.max(0, w), h, r); else ctx.rect(x, y, Math.max(0, w), h); }
function outlined(s, x, y, size, color) {
  ctx.font = `${size}px "Dela Gothic One", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, size * 0.18); ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.lineJoin = 'round';
  ctx.strokeText(s, x, y); ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function bubble(x, y, s, bg, size) {
  ctx.font = `${size}px "Dela Gothic One", sans-serif`;
  const w = ctx.measureText(s).width + 20, h = size + 12;
  ctx.fillStyle = bg; roundRect(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, x, y + 1);
}

function drawSoldier(x, z, leader) {
  const p = proj(x, 0, z); if (!p) return;
  const k = p.s, bob = Math.sin(G.t * 14 + x * 5) * k * 0.02;
  // 影
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(p.x, p.y, k * 0.2, k * 0.06, 0, 0, 6.28); ctx.fill();
  // 脚
  ctx.fillStyle = '#1b3f8f';
  ctx.fillRect(p.x - k * 0.12, p.y - k * 0.36 + bob, k * 0.09, k * 0.36);
  ctx.fillRect(p.x + k * 0.03, p.y - k * 0.36 - bob, k * 0.09, k * 0.36);
  // 胴
  ctx.fillStyle = leader ? '#2a63d6' : '#2f6fe4';
  roundRect(p.x - k * 0.16, p.y - k * 0.74, k * 0.32, k * 0.42, k * 0.06); ctx.fill();
  ctx.fillStyle = '#23364d'; ctx.fillRect(p.x - k * 0.13, p.y - k * 0.68, k * 0.26, k * 0.2);
  // 頭とヘルメット
  ctx.fillStyle = '#e2b48c'; ctx.beginPath(); ctx.arc(p.x, p.y - k * 0.82, k * 0.1, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#1e4fae'; ctx.beginPath(); ctx.arc(p.x, p.y - k * 0.85, k * 0.115, Math.PI, 0); ctx.fill();
  // 銃
  ctx.strokeStyle = '#222'; ctx.lineWidth = Math.max(1.5, k * 0.05);
  ctx.beginPath(); ctx.moveTo(p.x + k * 0.12, p.y - k * 0.5); ctx.lineTo(p.x + k * 0.1, p.y - k * 0.86); ctx.stroke();
}

function drawZombie(zb) {
  const p = proj(zb.x, 0, zb.z); if (!p) return;
  const k = p.s * zb.size, sw = Math.sin(zb.ph) * k * 0.05;
  const fade = zb.z > FAR - 20 ? Math.max(0, (FAR - zb.z) / 20) : 1;
  ctx.globalAlpha = fade;
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(p.x, p.y, k * 0.2, k * 0.06, 0, 0, 6.28); ctx.fill();
  const hit = zb.flash > 0;
  ctx.fillStyle = hit ? '#fff' : '#3b3f47';
  ctx.fillRect(p.x - k * 0.12, p.y - k * 0.38 + sw, k * 0.09, k * 0.38);
  ctx.fillRect(p.x + k * 0.03, p.y - k * 0.38 - sw, k * 0.09, k * 0.38);
  ctx.fillStyle = hit ? '#fff' : zb.shirt;
  roundRect(p.x - k * 0.17, p.y - k * 0.78, k * 0.34, k * 0.44, k * 0.05); ctx.fill();
  // 前に伸びた腕
  ctx.fillStyle = hit ? '#fff' : '#8fa874';
  ctx.beginPath(); ctx.arc(p.x - k * 0.13, p.y - k * 0.5 + sw, k * 0.06, 0, 6.28); ctx.arc(p.x + k * 0.13, p.y - k * 0.5 - sw, k * 0.06, 0, 6.28); ctx.fill();
  // 頭
  ctx.beginPath(); ctx.arc(p.x + sw * 0.5, p.y - k * 0.88, k * 0.12, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#e8312f';
  ctx.fillRect(p.x - k * 0.06 + sw * 0.5, p.y - k * 0.9, k * 0.035, k * 0.025);
  ctx.fillRect(p.x + k * 0.025 + sw * 0.5, p.y - k * 0.9, k * 0.035, k * 0.025);
  if (zb.power > 1 && zb.hp < zb.max) {
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(p.x - k * 0.25, p.y - k * 1.15, k * 0.5, k * 0.05);
    ctx.fillStyle = '#ff5050'; ctx.fillRect(p.x - k * 0.25, p.y - k * 1.15, k * 0.5 * zb.hp / zb.max, k * 0.05);
  }
  ctx.globalAlpha = 1;
}

function drawBoss(B) {
  const p = proj(B.x, 0, B.z); if (!p) return;
  const k = p.s * 3.1, sw = Math.sin(B.ph) * k * 0.03, hit = B.flash > 0;
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(p.x, p.y, k * 0.3, k * 0.07, 0, 0, 6.28); ctx.fill();
  ctx.fillStyle = hit ? '#fff' : '#2c2a35';
  ctx.fillRect(p.x - k * 0.17, p.y - k * 0.4 + sw, k * 0.14, k * 0.4);
  ctx.fillRect(p.x + k * 0.03, p.y - k * 0.4 - sw, k * 0.14, k * 0.4);
  ctx.fillStyle = hit ? '#fff' : '#6d5a86';
  roundRect(p.x - k * 0.27, p.y - k * 0.86, k * 0.54, k * 0.5, k * 0.1); ctx.fill();
  ctx.fillStyle = hit ? '#fff' : '#7f9a68';
  ctx.beginPath(); ctx.arc(p.x - k * 0.3, p.y - k * 0.62 + sw, k * 0.09, 0, 6.28); ctx.arc(p.x + k * 0.3, p.y - k * 0.62 - sw, k * 0.09, 0, 6.28); ctx.fill();
  ctx.beginPath(); ctx.arc(p.x, p.y - k * 0.95, k * 0.14, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#ff2a2a';
  ctx.fillRect(p.x - k * 0.07, p.y - k * 0.98, k * 0.04, k * 0.025); ctx.fillRect(p.x + k * 0.03, p.y - k * 0.98, k * 0.04, k * 0.025);
}

function drawGate(g) {
  if (g.z < -0.5) return;
  const x0 = g.side < 0 ? -ROAD + 0.05 : 0.05, x1 = g.side < 0 ? -0.05 : ROAD - 0.05;
  const h = 1.5;
  const a = proj(x0, 0, g.z), b = proj(x1, 0, g.z), c = proj(x1, h, g.z), d = proj(x0, h, g.z);
  if (!a || !c) return;
  const gv = Math.floor(g.g.v), good = g.g.op === 'x' || (g.g.op === '+' && gv >= 0);
  const fade = g.z > FAR - 20 ? Math.max(0, (FAR - g.z) / 20) : 1;
  ctx.globalAlpha = fade * (g.pair.passed && !g.hit ? 0.35 : 1);
  ctx.fillStyle = g.flash > 0 ? (good ? 'rgba(140,200,255,.85)' : 'rgba(255,160,160,.85)') : (good ? 'rgba(47,140,255,.55)' : 'rgba(255,74,74,.6)');
  poly([a, b, c, d]);
  ctx.strokeStyle = good ? '#cfe6ff' : '#ffd0d0'; ctx.lineWidth = Math.max(2, a.s * 0.06); ctx.stroke();
  const label = g.g.op === '+' ? (gv >= 0 ? '+' + gv : String(gv)) : g.g.op === 'x' ? '×' + g.g.v : '÷' + g.g.v;
  outlined(label, (a.x + b.x) / 2, (a.y + d.y) / 2, Math.max(10, a.s * 0.55), '#fff');
  ctx.globalAlpha = 1;
}

function drawCrate(c) {
  const p = proj(c.x, 0, c.z); if (!p) return;
  const k = p.s;
  const fade = c.z > FAR - 20 ? Math.max(0, (FAR - c.z) / 20) : 1;
  ctx.globalAlpha = fade;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(p.x, p.y, k * 0.6, k * 0.12, 0, 0, 6.28); ctx.fill();
  ctx.fillStyle = c.flash > 0 ? '#fff3d8' : '#b8843f';
  ctx.fillRect(p.x - k * 0.55, p.y - k * 1.0, k * 1.1, k * 1.0);
  ctx.strokeStyle = '#6e4a1f'; ctx.lineWidth = Math.max(1.5, k * 0.05);
  ctx.strokeRect(p.x - k * 0.55, p.y - k * 1.0, k * 1.1, k * 1.0);
  ctx.beginPath(); ctx.moveTo(p.x - k * 0.55, p.y - k); ctx.lineTo(p.x + k * 0.55, p.y); ctx.moveTo(p.x + k * 0.55, p.y - k); ctx.lineTo(p.x - k * 0.55, p.y); ctx.stroke();
  outlined(String(Math.ceil(c.hp)), p.x, p.y - k * 0.5, Math.max(10, k * 0.5), '#fff');
  const label = G.weapon < WEAPONS.length - 1 ? WEAPONS[G.weapon + 1].name : '仲間';
  outlined(label, p.x, p.y - k * 1.2, Math.max(8, k * 0.22), '#ffd36b');
  ctx.globalAlpha = 1;
}

// ---------- 画面遷移 ----------
const show = (id, on) => { $(id).hidden = !on; };
function refreshTitle() {
  $('tCoins').textContent = '● ' + save.coins;
  $('startBtn').textContent = `スタート（STAGE ${save.stage}）`;
  $('tBest').textContent = save.best ? `最高到達：STAGE ${save.best}` : '';
}
function start() {
  newGame(save.stage);
  camX = 0;
  ['title', 'shopPanel', 'result', 'pausePanel'].forEach(id => show(id, false));
  show('hud', true);
  $('hStage').textContent = 'STAGE ' + save.stage;
  state = 'play';
}
function pause() { if (state !== 'play') return; state = 'pause'; show('pausePanel', true); }
function resume() { show('pausePanel', false); state = 'play'; last = performance.now(); }
function finish(win) {
  state = 'result';
  const earned = G.coinsRun + (win ? 20 * G.stage : 0);
  save.coins += earned;
  if (win) { save.best = Math.max(save.best, G.stage); save.stage = G.stage + 1; }
  persist();
  $('rTitle').textContent = win ? `STAGE ${G.stage} クリア！` : 'ゲームオーバー';
  $('rTitle').style.color = win ? '#7fd1ff' : '#ff8a8a';
  $('rStats').innerHTML = `<dt>倒したゾンビ</dt><dd>${G.kills}</dd>` +
    (win ? `<dt>生き残った仲間</dt><dd>${G.men}</dd><dt>クリアボーナス</dt><dd class="coins">● ${20 * G.stage}</dd>` : `<dt>進んだ距離</dt><dd>${Math.min(100, Math.round(G.dist / (G.L + 8) * 100))}%</dd>`) +
    `<dt>もらったコイン</dt><dd class="coins">● ${earned}</dd><dt>所持コイン</dt><dd class="coins">● ${save.coins}</dd>`;
  $('rNext').textContent = win ? `STAGE ${save.stage} へ` : 'もう一度';
  show('hud', false); show('result', true);
}
let shopBack = 'title';
function openShop(from) { shopBack = from; show(from, false); renderShop(); show('shopPanel', true); }
function renderShop() {
  $('sCoins').textContent = '● ' + save.coins;
  const list = $('shopList'); list.innerHTML = '';
  for (const u of UPGRADES) {
    const lv = save.up[u.key], maxed = lv >= u.max, cost = u.cost(lv);
    const row = document.createElement('div'); row.className = 'item';
    row.innerHTML = `<b>${u.name} <small style="color:var(--dim)">Lv.${lv}</small></b><span>${u.desc(lv)}${maxed ? '' : '<br>次：' + u.desc(lv + 1)}</span>`;
    const btn = document.createElement('button');
    btn.id = 'buy-' + u.key;
    btn.textContent = maxed ? '最大' : '● ' + cost;
    btn.disabled = maxed || save.coins < cost;
    btn.onclick = () => { if (save.coins >= cost && !maxed) { save.coins -= cost; save.up[u.key]++; persist(); renderShop(); refreshTitle(); } };
    row.appendChild(btn); list.appendChild(row);
  }
}
$('startBtn').onclick = start;
$('shopBtn').onclick = () => openShop('title');
$('shopClose').onclick = () => { show('shopPanel', false); if (shopBack === 'title') refreshTitle(); show(shopBack, true); };
$('rNext').onclick = start;
$('rShop').onclick = () => openShop('result');
$('rTitleBtn').onclick = () => { show('result', false); refreshTitle(); show('title', true); state = 'title'; G = null; };
$('pauseBtn').onclick = pause;
$('resumeBtn').onclick = resume;
$('quitBtn').onclick = () => { show('pausePanel', false); state = 'play'; G.men = 0; G.over = 'lose'; G.endT = 0; };
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

// ---------- ループ ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play' && G) update(dt);
  draw();
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize(); refreshTitle();
requestAnimationFrame(frame);
})();
</script>
